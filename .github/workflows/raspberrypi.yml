name: Raspberry Pi build

on:
  push:
    branches:
      - master
      - next
      - 'next*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'AUTHORS'
      - 'THANKS'
      - 'COPYING'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildx:
    name: Build with Buildx
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: git fetch --prune --unshallow --tags

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm/v6

      -
        name: Build
        id: build
        run: |
          mkdir build/
          bash .github/scripts/ci-command.sh docker build -f Dockerfile.raspberrypi --platform linux/arm/v6 --target export -t build --output . .
          ls -lah

      - name: Archive artifacts (welle-cli ARMv6)
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: welle-cli Raspberry Pi ARMv6
          path: build/*
          if-no-files-found: error
